name: Release

# Every push to main builds the app and publishes it as a GitHub release.
# Installed copies of Mini mouse hub check the latest release and update themselves.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.3.${{ github.run_number }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test

      - name: Publish
        run: dotnet publish src/MiniMouseHub.App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:Version=${{ env.VERSION }} -o publish

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ env.VERSION }}" publish/MiniMouseHub.exe --target "${{ github.sha }}" --title "Mini mouse hub ${{ env.VERSION }}" --generate-notes
