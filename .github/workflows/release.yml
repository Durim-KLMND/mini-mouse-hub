name: Release

# Every push to main builds the app and publishes it as a GitHub release, with two files:
# MiniMouseHub.exe, which installed copies download to update themselves (Updater.cs), and
# MiniMouseHub-Setup.exe, the per-user installer for new installs (installer/MiniMouseHub.iss).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.3.${{ github.run_number }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test

      - name: Publish
        run: dotnet publish src/MiniMouseHub.App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:Version=${{ env.VERSION }} -o publish

      - name: Build installer
        shell: pwsh
        run: |
          # Inno Setup from NuGet, pinned so the build doesn't change under us.
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.1/tools.innosetup.6.7.1.nupkg -OutFile inno.zip
          Expand-Archive inno.zip inno
          inno\tools\ISCC.exe /DAppVersion=${{ env.VERSION }} "/DSourceExe=$PWD\publish\MiniMouseHub.exe" "/O$PWD\publish" installer\MiniMouseHub.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ env.VERSION }}" publish/MiniMouseHub.exe publish/MiniMouseHub-Setup.exe --target "${{ github.sha }}" --title "Mini mouse hub ${{ env.VERSION }}" --generate-notes
